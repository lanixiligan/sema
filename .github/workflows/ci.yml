name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The training code's tests (training/). Only the two packages the
      # scripts need, at the versions training/requirements.txt pins; the
      # notebooks' packages aren't needed to test.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install training dependencies
        run: grep -E '^(numpy|scikit-learn)==' training/requirements.txt | pip install -r /dev/stdin

      - name: Test training code
        run: python3 -m unittest discover training
